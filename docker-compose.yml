name: opendraw

services:
  db-setup:
    image: ghcr.io/hasibweb/opendraw-server:${OPENDRAW_IMAGE_TAG:-main}
    init: true
    command: ["bun", "run", "--cwd", "/app/packages/db", "db:setup"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private Coolify PostgreSQL connection URL}
    restart: "no"

  server:
    image: ghcr.io/hasibweb/opendraw-server:${OPENDRAW_IMAGE_TAG:-main}
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the private Coolify PostgreSQL connection URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret with at least 32 characters}
      BETTER_AUTH_URL: https://draw.hasibweb.com
      CORS_ORIGIN: https://draw.hasibweb.com
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set the production GitHub OAuth client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set the production GitHub OAuth client secret}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:?Set the platform Gemini API key}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?Set a base64 encoded 32-byte key}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the production Resend API key}
      RESEND_FROM: ${RESEND_FROM:-OpenDraw <support@hasibweb.com>}
      NODE_ENV: production
      LOG_DIAGRAM_SPEC: "false"
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    image: ghcr.io/hasibweb/opendraw-web:${OPENDRAW_IMAGE_TAG:-main}
    init: true
    expose:
      - "3001"
    environment:
      NEXT_PUBLIC_SERVER_URL: https://draw.hasibweb.com
      API_UPSTREAM_URL: http://server:3000
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-1}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
