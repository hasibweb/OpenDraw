name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun version comes from `packageManager` in the root package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: just check-ci

      - name: Typecheck
        run: just types

      - name: Harness tests
        run: just test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Placeholder value: the build only has to prove everything bundles, but
      # NEXT_PUBLIC_SERVER_URL is read at build time by src/lib/auth-client.ts,
      # which throws without it. Turbo passes NEXT_PUBLIC_* through to the task
      # automatically via framework inference.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
          NEXT_PUBLIC_ASSET_URL: "https://assets.example.com"

  deploy:
    name: Publish images and deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          build-args: |
            OPENDRAW_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/hasibweb/opendraw-server:main
            ghcr.io/hasibweb/opendraw-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and publish web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://draw.hasibweb.com
            API_UPSTREAM_URL=http://server:3000
            OPENDRAW_RELEASE=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/hasibweb/opendraw-web:main
            ghcr.io/hasibweb/opendraw-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Queue Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"

      - name: Verify deployed release
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            web_release=$(curl --fail --silent https://draw.hasibweb.com/health | jq -r '.release' 2>/dev/null || true)
            api_release=$(curl --fail --silent https://draw.hasibweb.com/api/health | jq -r '.release' 2>/dev/null || true)
            if [ "$web_release" = "$EXPECTED_RELEASE" ] && [ "$api_release" = "$EXPECTED_RELEASE" ]; then
              echo "OpenDraw $EXPECTED_RELEASE is healthy."
              exit 0
            fi
            echo "Waiting for Coolify deployment ($attempt/60)."
            sleep 10
          done

          echo "Coolify did not expose release $EXPECTED_RELEASE within 10 minutes."
          exit 1
